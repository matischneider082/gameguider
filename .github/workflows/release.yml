name: Release

# Push a tag such as v0.2.0 (matching pyproject.toml's version) to publish a GitHub release with the Python wheel,
# the prebuilt macOS app, and install.sh stamped with that version, which is what the one-line installer downloads.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the tag matches the package version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: Install project and build tools
        run: python -m pip install . build 'uv==0.12.21'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build distributions
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python
          path: dist/*
          if-no-files-found: error

  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the universal app
        run: |
          python -m pip install .
          game-guide package-app --out-dir out
          lipo -archs out/GameGuider.app/Contents/MacOS/GameGuider
          ditto -c -k --keepParent out/GameGuider.app GameGuider-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: GameGuider-macOS.zip
          if-no-files-found: error

  release:
    needs: [python, macos-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Stamp the installer with this version
        run: sed "s/__VERSION__/${GITHUB_REF_NAME#v}/" install.sh > assets/install.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --title "GameGuider ${GITHUB_REF_NAME#v}" --generate-notes
