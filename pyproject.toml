[project]
name = "game-guide"
version = "0.3.0"
description = "GameGuider: a game shelf and spoiler-aware walkthrough companion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["markdown-it-py[linkify]>=3", "pydantic>=2", "textual>=3", "textual-image[textual]>=0.8"]

[project.scripts]
game-guide = "game_guide.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/game_guide"]

[tool.hatch.build.targets.wheel.force-include]
"skills/game-guide" = "game_guide/_plugin/skills/game-guide"
".claude-plugin" = "game_guide/_plugin/.claude-plugin"
"build/icon.icns" = "game_guide/_plugin/build/icon.icns"
"build/icon.py" = "game_guide/_plugin/build/icon.py"
"build/icon.png" = "game_guide/_plugin/build/icon.png"

[tool.hatch.build.targets.sdist]
include = ["/src", "/skills", "/.claude-plugin", "/build/icon.py", "/build/icon.icns", "/build/icon.png", "/build/icon.ico", "/README.md", "/pyproject.toml", "/tests", "/mise.toml", "/uv.lock"]
